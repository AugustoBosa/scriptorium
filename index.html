<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#f4ecd8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scriptorium</title>
</head>
<body data-nivel="basico">
<header>
  <button id="menu" type="button" popovertarget="nav-oficinas" aria-label="Abrir menu">☰</button>
  <h1><a href="#inicio">Scriptorium</a></h1>
  <nav id="nav-oficinas" class="oficinas" aria-label="Seções" popover>
    <a href="#inicio">Início</a><a href="#carta">Carta</a><a href="#magias">Magias</a><a href="#livro">Livro</a><a href="#sigilos">Sigilos</a><a href="#letra">Minha letra</a><a href="#personagens" class="sep">Personagens</a><a href="#biblioteca">Biblioteca</a>
  </nav>
  <button id="tema" type="button">Vela</button>
</header>
<section id="vista-inicio" class="pagina" hidden></section>
<section id="vista-personagens" class="pagina" hidden></section>
<section id="vista-biblioteca" class="pagina" hidden></section>
<main>
  <aside id="painel" aria-labelledby="t-painel">
    <h2 id="t-painel" class="so-leitor">Parâmetros</h2>
    <div id="nivel" role="radiogroup" aria-label="Nível">
      <label><input type="radio" name="nivel" value="basico" checked> Básico</label>
      <label><input type="radio" name="nivel" value="avancado"> Avançado</label>
    </div>
    <div id="grupos"></div>
  </aside>
  <section id="area-previa" aria-labelledby="t-previa">
    <h2 id="t-previa" class="so-leitor">Prévia</h2>
    <div class="barra-previa">
      <div class="vista-previa" role="group" aria-label="Vista da prévia"><button type="button" id="vista-pagina" aria-pressed="true">Página</button><button type="button" id="vista-mesa" aria-pressed="false">Mesa</button></div>
      <div class="paginas"><button type="button" id="pag-ant">‹ Anterior</button><span id="pag-info" aria-live="polite">Página 1 de 1</span><button type="button" id="pag-prox">Próxima ›</button></div>
      <label id="rotulo-comparar"><input type="checkbox" id="comparar"> Comparar</label>
      <select id="variacao-b" aria-label="Variação B" hidden></select>
      <button type="button" id="salvar-material">Salvar na biblioteca</button><span id="salvo" class="salvo" aria-live="polite"></span>
    </div>
    <div id="previas">
      <figure><p class="rotulo" id="rotulo-a"></p><div class="folha" id="previa"><p class="vazio">Carregando fontes…</p></div></figure>
      <figure id="previa-b-bloco" hidden><p class="rotulo" id="rotulo-b"></p><div class="folha" id="previa-b"></div></figure>
    </div>
    <p id="erro" class="erro" role="alert"></p>
    <ul id="avisos" aria-live="polite"></ul>
  </section>
  <footer id="exportar" class="barra-exportar"></footer>
</main>
<dialog id="editor"></dialog>
<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
